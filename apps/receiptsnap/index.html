<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReceiptSnap - Offline Expense Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Tesseract OCR -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex flex-col overflow-hidden">
    <!-- Header -->
    <header class="bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between shadow-sm">
        <div class="flex items-center space-x-3">
            <div class="bg-emerald-600 text-white p-2 rounded-xl shadow-sm">
                <i data-lucide="receipt" class="w-5 h-5"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-tight">ReceiptSnap</h1>
                <p class="text-xs text-slate-500">Offline OCR Expense Tracker</p>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <label class="flex items-center space-x-1.5 px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium rounded-xl shadow-sm cursor-pointer transition">
                <i data-lucide="upload" class="w-4 h-4"></i>
                <span>Scan Receipt</span>
                <input type="file" accept="image/*" onchange="processReceipt(event)" class="hidden">
            </label>
        </div>
    </header>

    <!-- Main Content -->
    <div class="flex-1 flex overflow-hidden">
        <!-- Expenses Ledger -->
        <main class="flex-1 flex flex-col overflow-y-auto p-6 space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center space-x-4">
                    <div class="bg-emerald-50 text-emerald-600 p-3 rounded-xl"><i data-lucide="dollar-sign" class="w-6 h-6"></i></div>
                    <div>
                        <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">Total Spent</p>
                        <h3 class="text-2xl font-bold text-slate-800" id="total-spent">$0.00</h3>
                    </div>
                </div>
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center space-x-4">
                    <div class="bg-indigo-50 text-indigo-600 p-3 rounded-xl"><i data-lucide="file-text" class="w-6 h-6"></i></div>
                    <div>
                        <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">Total Receipts</p>
                        <h3 class="text-2xl font-bold text-slate-800" id="total-count">0</h3>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex-1 flex flex-col">
                <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
                    <h3 class="font-bold text-slate-800">Expense Log</h3>
                </div>
                <div class="overflow-y-auto flex-1">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-50 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-100">
                                <th class="px-6 py-3 font-semibold">Vendor</th>
                                <th class="px-6 py-3 font-semibold">Date</th>
                                <th class="px-6 py-3 font-semibold">Category</th>
                                <th class="px-6 py-3 font-semibold text-right">Amount</th>
                                <th class="px-6 py-3 font-semibold text-center">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="expense-table-body" class="divide-y divide-slate-100 text-sm"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- OCR Processing Modal -->
    <div id="ocr-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md mx-4 p-8 text-center space-y-4">
            <div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mx-auto animate-spin">
                <i data-lucide="loader" class="w-6 h-6"></i>
            </div>
            <h3 class="font-bold text-lg">Scanning Receipt...</h3>
            <p id="ocr-status" class="text-xs text-slate-500">Initializing OCR Engine offline...</p>
        </div>
    </div>

    <!-- Script Application Logic -->
    <script>
        let state = {
            expenses: JSON.parse(localStorage.getItem('rs_expenses')) || [
                { id: 'e1', vendor: 'Office Depot', date: '2026-06-01', category: 'Supplies', amount: 45.99 },
                { id: 'e2', vendor: 'Starbucks Coffee', date: '2026-06-03', category: 'Food & Dining', amount: 8.50 }
            ]
        };

        function render() {
            lucide.createIcons();
            const tbody = document.getElementById('expense-table-body');
            tbody.innerHTML = '';

            let total = 0;
            state.expenses.forEach(exp => {
                total += Number(exp.amount);
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50 transition';
                tr.innerHTML = `
                    <td class="px-6 py-4 font-medium text-slate-800">${exp.vendor}</td>
                    <td class="px-6 py-4 text-slate-500 text-xs">${exp.date}</td>
                    <td class="px-6 py-4"><span class="px-2.5 py-1 bg-slate-100 text-slate-600 text-xs rounded-lg">${exp.category}</span></td>
                    <td class="px-6 py-4 text-right font-semibold text-slate-800">$${Number(exp.amount).toFixed(2)}</td>
                    <td class="px-6 py-4 text-center">
                        <button onclick="deleteExpense('${exp.id}')" class="text-slate-400 hover:text-red-500 transition"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('total-spent').innerText = `$${total.toFixed(2)}`;
            document.getElementById('total-count').innerText = state.expenses.length;
            lucide.createIcons();
        }

        async function processReceipt(e) {
            const file = e.target.files[0];
            if (!file) return;

            const modal = document.getElementById('ocr-modal');
            const status = document.getElementById('ocr-status');
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            try {
                status.innerText = "Extracting text from receipt...";
                const result = await Tesseract.recognize(file, 'eng');
                const text = result.data.text;

                // Simple regex extraction heuristic
                let amount = 0.00;
                const matches = text.match(/\d+\.\d{2}/g);
                if (matches && matches.length > 0) {
                    amount = Math.max(...matches.map(Number));
                }

                state.expenses.push({
                    id: 'e_' + Math.random(),
                    vendor: 'Scanned Vendor',
                    date: new Date().toISOString().split('T')[0],
                    category: 'General',
                    amount: amount || 12.00
                });

                localStorage.setItem('rs_expenses', JSON.stringify(state.expenses));
                render();
            } catch (err) {
                alert('OCR Failed: ' + err.message);
            } finally {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }
        }

        function deleteExpense(id) {
            state.expenses = state.expenses.filter(e => e.id !== id);
            localStorage.setItem('rs_expenses', JSON.stringify(state.expenses));
            render();
        }

        window.onload = render;
    </script>
</body>
</html>
