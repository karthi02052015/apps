<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Car Clash Arena</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
}

body{
    background:#090b12;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
}

button{
    border:0;
    cursor:pointer;
}

#app{
    width:100vw;
    height:100vh;
    position:relative;
    overflow:hidden;
}

/* ================= MENU ================= */

#menu{
    position:absolute;
    inset:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at center,#252d45 0,#0d111c 45%,#05060a 100%);
}

.menu-box{
    width:min(520px,92vw);
    padding:35px;
    border:2px solid #37445f;
    border-radius:25px;
    background:rgba(10,14,24,.94);
    box-shadow:0 25px 80px rgba(0,0,0,.7);
    text-align:center;
}

.logo{
    font-size:42px;
    font-weight:900;
    letter-spacing:3px;
    color:#ffcf3f;
    text-shadow:0 5px 20px #ff7b00;
    margin-bottom:8px;
}

.subtitle{
    color:#9da8bc;
    margin-bottom:28px;
}

.section-title{
    text-align:left;
    color:#aebbd0;
    font-size:13px;
    font-weight:bold;
    margin:18px 0 8px;
    text-transform:uppercase;
}

.mode-row,
.players-row{
    display:flex;
    gap:10px;
}

.mode-btn,
.player-btn{
    flex:1;
    padding:15px 8px;
    color:white;
    background:#171e2d;
    border:1px solid #34405a;
    border-radius:12px;
    font-weight:bold;
}

.mode-btn.active,
.player-btn.active{
    background:#ff8a00;
    border-color:#ffc14d;
    color:#111;
}

#startBtn{
    width:100%;
    margin-top:25px;
    padding:18px;
    border-radius:14px;
    background:linear-gradient(135deg,#ffb300,#ff5e00);
    color:#111;
    font-size:19px;
    font-weight:900;
    box-shadow:0 8px 25px rgba(255,115,0,.35);
}

#startBtn:hover{
    transform:translateY(-2px);
}

/* ================= GAME ================= */

#game{
    position:absolute;
    inset:0;
    display:none;
    background:#10151e;
}

canvas{
    position:absolute;
    inset:0;
}

/* ================= HUD ================= */

#hud{
    position:absolute;
    top:15px;
    left:15px;
    right:15px;
    z-index:5;
    display:flex;
    justify-content:space-between;
    pointer-events:none;
}

.hud-box{
    min-width:190px;
    padding:12px 15px;
    border-radius:14px;
    background:rgba(7,10,17,.8);
    border:1px solid #34405a;
}

.hud-title{
    font-size:12px;
    color:#9ba7bb;
    margin-bottom:6px;
}

.hp-bar{
    width:160px;
    height:10px;
    background:#242b37;
    border-radius:10px;
    overflow:hidden;
}

.hp-fill{
    height:100%;
    width:100%;
    background:#38e078;
    transition:.1s;
}

#score{
    font-size:22px;
    font-weight:900;
}

#objective{
    text-align:right;
}

/* ================= CONTROLS ================= */

#controls{
    position:absolute;
    inset:0;
    z-index:6;
    pointer-events:none;
}

.control{
    position:absolute;
    pointer-events:auto;
    width:62px;
    height:62px;
    border-radius:50%;
    background:rgba(25,31,44,.78);
    border:2px solid #59667f;
    color:white;
    font-size:24px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.control:active{
    background:#ff8700;
    color:#111;
}

#up{
    bottom:125px;
    left:95px;
}

#down{
    bottom:25px;
    left:95px;
}

#left{
    bottom:75px;
    left:25px;
}

#right{
    bottom:75px;
    left:165px;
}

#fire{
    right:35px;
    bottom:70px;
    width:90px;
    height:90px;
    background:#ff4b20;
    border-color:#ff9b72;
    font-size:16px;
    font-weight:900;
}

#boost{
    right:140px;
    bottom:45px;
    width:65px;
    height:65px;
    background:#276fff;
    border-color:#75a1ff;
    font-size:13px;
    font-weight:bold;
}

/* ================= END ================= */

#result{
    position:absolute;
    inset:0;
    z-index:30;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.72);
}

.result-box{
    width:min(420px,90vw);
    text-align:center;
    padding:35px;
    border-radius:25px;
    background:#101622;
    border:2px solid #394760;
}

#resultTitle{
    font-size:42px;
    margin-bottom:10px;
}

#resultText{
    color:#aeb8ca;
    margin-bottom:25px;
}

#restartBtn{
    width:100%;
    padding:16px;
    border-radius:12px;
    background:#ff9b00;
    font-weight:900;
}

/* mobile */
@media(max-width:600px){
    .logo{
        font-size:32px;
    }

    .menu-box{
        padding:25px 20px;
    }

    #hud{
        top:8px;
        left:8px;
        right:8px;
    }

    .hud-box{
        min-width:130px;
        padding:8px;
    }

    .hp-bar{
        width:110px;
    }
}
</style>
</head>

<body>

<div id="app">

<!-- ================= MENU ================= -->

<div id="menu">

    <div class="menu-box">

        <div class="logo">CAR CLASH</div>
        <div class="subtitle">ARENA COMBAT</div>

        <div class="section-title">Game Mode</div>

        <div class="mode-row">
            <button class="mode-btn active" data-mode="single">
                SINGLE PLAYER
            </button>

            <button class="mode-btn" data-mode="team">
                TEAM BATTLE
            </button>
        </div>

        <div id="teamOptions">

            <div class="section-title">
                Human Players
            </div>

            <div class="players-row">

                <button class="player-btn active"
                        data-players="1">
                    1
                </button>

                <button class="player-btn"
                        data-players="2">
                    2
                </button>

                <button class="player-btn"
                        data-players="3">
                    3
                </button>

            </div>

        </div>

        <button id="startBtn">
            START BATTLE
        </button>

    </div>

</div>


<!-- ================= GAME ================= -->

<div id="game">

    <canvas id="canvas"></canvas>

    <div id="hud">

        <div class="hud-box">

            <div class="hud-title">
                YOUR CAR
            </div>

            <div class="hp-bar">
                <div id="playerHP"
                     class="hp-fill">
                </div>
            </div>

            <div style="margin-top:6px">
                <span id="hpText">100</span> HP
            </div>

        </div>


        <div class="hud-box"
             id="objective">

            <div class="hud-title">
                BATTLE
            </div>

            <div id="score">
                0 - 0
            </div>

        </div>

    </div>


    <div id="controls">

        <div id="up" class="control">▲</div>
        <div id="down" class="control">▼</div>
        <div id="left" class="control">◀</div>
        <div id="right" class="control">▶</div>

        <div id="boost" class="control">
            BOOST
        </div>

        <div id="fire" class="control">
            FIRE
        </div>

    </div>

</div>


<!-- ================= RESULT ================= -->

<div id="result">

    <div class="result-box">

        <div id="resultTitle">
            VICTORY
        </div>

        <div id="resultText">
            Enemy team destroyed.
        </div>

        <button id="restartBtn">
            PLAY AGAIN
        </button>

    </div>

</div>

</div>


<script>

/* =========================================================
   CAR CLASH ARENA
   ========================================================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;

function resize(){

    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;

}

window.addEventListener("resize",resize);
resize();


/* =========================================================
   GAME STATE
   ========================================================= */

let gameRunning = false;

let gameMode = "single";

let humanPlayers = 1;

let cars = [];
let bullets = [];
let particles = [];

let player = null;

let keys = {};

let lastTime = 0;

let playerKills = 0;
let enemyKills = 0;


/* =========================================================
   INPUT
   ========================================================= */

window.addEventListener("keydown",e=>{

    keys[e.key.toLowerCase()] = true;

});

window.addEventListener("keyup",e=>{

    keys[e.key.toLowerCase()] = false;

});


/* =========================================================
   MENU
   ========================================================= */

document.querySelectorAll(".mode-btn").forEach(btn=>{

    btn.onclick = ()=>{

        document.querySelectorAll(".mode-btn")
        .forEach(x=>x.classList.remove("active"));

        btn.classList.add("active");

        gameMode = btn.dataset.mode;

        document.getElementById("teamOptions")
        .style.display =
            gameMode === "team"
            ? "block"
            : "none";

    };

});


document.querySelectorAll(".player-btn").forEach(btn=>{

    btn.onclick = ()=>{

        document.querySelectorAll(".player-btn")
        .forEach(x=>x.classList.remove("active"));

        btn.classList.add("active");

        humanPlayers =
            Number(btn.dataset.players);

    };

});


/* =========================================================
   VECTOR
   ========================================================= */

function distance(a,b){

    return Math.hypot(
        a.x-b.x,
        a.y-b.y
    );

}


/* =========================================================
   CAR
   ========================================================= */

class Car{

    constructor(x,y,team,isHuman=false){

        this.x=x;
        this.y=y;

        this.team=team;

        this.isHuman=isHuman;

        this.angle=0;

        this.speed=0;

        this.maxSpeed=3.4;

        this.acceleration=.16;

        this.friction=.94;

        this.turnSpeed=.055;

        this.width=38;
        this.height=58;

        this.hp=100;
        this.maxHp=100;

        this.cooldown=0;

        this.dead=false;

        this.aiTarget=null;

        this.aiTimer=0;

        this.boost=100;

    }


    update(dt){

        if(this.dead)
            return;


        if(this.isHuman){

            this.controlPlayer();

        }else{

            this.controlAI();

        }


        this.speed *= this.friction;


        this.x +=
            Math.sin(this.angle) *
            this.speed;

        this.y -=
            Math.cos(this.angle) *
            this.speed;


        this.x = Math.max(
            35,
            Math.min(W-35,this.x)
        );

        this.y = Math.max(
            35,
            Math.min(H-35,this.y)
        );


        if(this.cooldown>0)
            this.cooldown--;


        if(this.aiTimer>0)
            this.aiTimer--;

    }


    controlPlayer(){

        let forward =
            keys["w"] ||
            keys["arrowup"];

        let backward =
            keys["s"] ||
            keys["arrowdown"];

        let left =
            keys["a"] ||
            keys["arrowleft"];

        let right =
            keys["d"] ||
            keys["arrowright"];


        if(forward){

            this.speed +=
                this.acceleration;

        }


        if(backward){

            this.speed -=
                this.acceleration;

        }


        if(left){

            this.angle -=
                this.turnSpeed *
                Math.max(
                    .5,
                    Math.abs(this.speed)/2
                );

        }


        if(right){

            this.angle +=
                this.turnSpeed *
                Math.max(
                    .5,
                    Math.abs(this.speed)/2
                );

        }


        this.speed =
            Math.max(
                -this.maxSpeed*.45,
                Math.min(
                    this.maxSpeed,
                    this.speed
                )
            );


        if(
            keys[" "] ||
            keys["f"]
        ){

            this.shoot();

        }


        if(keys["shift"]){

            this.useBoost();

        }

    }


    controlAI(){

        let target =
            findNearestEnemy(this);


        if(!target)
            return;


        this.aiTarget=target;


        let dx=target.x-this.x;
        let dy=target.y-this.y;


        let desired =
            Math.atan2(dx,-dy);


        let diff =
            normalizeAngle(
                desired-this.angle
            );


        if(diff>.08){

            this.angle +=
                this.turnSpeed;

        }

        if(diff<-.08){

            this.angle -=
                this.turnSpeed;

        }


        let d =
            Math.hypot(dx,dy);


        if(d>230){

            this.speed +=
                this.acceleration*.65;

        }else if(d<140){

            this.speed -=
                this.acceleration*.35;

        }else{

            this.speed +=
                this.acceleration*.2;

        }


        this.speed =
            Math.max(
                -this.maxSpeed*.3,
                Math.min(
                    this.maxSpeed*.8,
                    this.speed
                )
            );


        if(
            Math.abs(diff)<.18 &&
            d<520
        ){

            this.shoot();

        }

    }


    useBoost(){

        if(this.boost<=0)
            return;

        this.speed += .45;

        this.boost -= .8;

    }


    shoot(){

        if(this.cooldown>0)
            return;


        this.cooldown =
            this.isHuman
            ? 18
            : 38;


        let bx =
            this.x +
            Math.sin(this.angle)*38;

        let by =
            this.y -
            Math.cos(this.angle)*38;


        bullets.push({

            x:bx,
            y:by,

            vx:
                Math.sin(this.angle)*8,

            vy:
                -Math.cos(this.angle)*8,

            team:this.team,

            owner:this,

            life:90,

            damage:
                this.isHuman
                ? 18
                : 10

        });

    }


    damage(amount,attacker){

        if(this.dead)
            return;


        this.hp -= amount;


        createExplosion(
            this.x,
            this.y,
            5
        );


        if(this.hp<=0){

            this.hp=0;

            this.dead=true;


            createExplosion(
                this.x,
                this.y,
                30
            );


            if(attacker){

                if(attacker.team==="player"){

                    playerKills++;

                }else{

                    enemyKills++;

                }

            }


            checkWin();

        }

    }


    draw(){

        if(this.dead)
            return;


        ctx.save();

        ctx.translate(
            this.x,
            this.y
        );

        ctx.rotate(this.angle);


        /* shadow */

        ctx.fillStyle=
            "rgba(0,0,0,.35)";

        ctx.fillRect(
            -this.width/2+4,
            -this.height/2+6,
            this.width,
            this.height
        );


        /* body */

        ctx.fillStyle =
            this.team==="player"
            ? "#ff9b00"
            : "#ef3340";


        if(this.team==="ally")
            ctx.fillStyle="#38a8ff";


        ctx.beginPath();

        ctx.roundRect(
            -this.width/2,
            -this.height/2,
            this.width,
            this.height,
            8
        );

        ctx.fill();


        /* roof */

        ctx.fillStyle="#202733";

        ctx.beginPath();

        ctx.roundRect(
            -14,
            -15,
            28,
            28,
            6
        );

        ctx.fill();


        /* windshield */

        ctx.fillStyle="#6ed7ff";

        ctx.fillRect(
            -10,
            -11,
            20,
            9
        );


        /* front */

        ctx.fillStyle="#ffe36d";

        ctx.fillRect(
            -13,
            -28,
            8,
            5
        );

        ctx.fillRect(
            5,
            -28,
            8,
            5
        );


        /* wheels */

        ctx.fillStyle="#090a0d";

        ctx.fillRect(
            -22,
            -20,
            7,
            16
        );

        ctx.fillRect(
            15,
            -20,
            7,
            16
        );

        ctx.fillRect(
            -22,
            5,
            7,
            16
        );

        ctx.fillRect(
            15,
            5,
            7,
            16
        );


        ctx.restore();


        /* health */

        const barW=50;

        ctx.fillStyle="#16191e";

        ctx.fillRect(
            this.x-barW/2,
            this.y-43,
            barW,
            5
        );

        ctx.fillStyle =
            this.team==="player"
            ? "#49e36f"
            : "#ff4650";

        ctx.fillRect(
            this.x-barW/2,
            this.y-43,
            barW*(this.hp/this.maxHp),
            5
        );

    }

}


/* =========================================================
   ANGLE
   ========================================================= */

function normalizeAngle(a){

    while(a>Math.PI)
        a-=Math.PI*2;

    while(a<-Math.PI)
        a+=Math.PI*2;

    return a;

}


/* =========================================================
   FIND ENEMY
   ========================================================= */

function findNearestEnemy(car){

    let enemies =
        cars.filter(
            c =>
                !c.dead &&
                c.team!==car.team
        );


    if(!enemies.length)
        return null;


    enemies.sort(
        (a,b)=>
            distance(car,a)-
            distance(car,b)
    );


    return enemies[0];

}


/* =========================================================
   BULLETS
   ========================================================= */

function updateBullets(){

    for(
        let i=bullets.length-1;
        i>=0;
        i--
    ){

        let b=bullets[i];

        b.x += b.vx;
        b.y += b.vy;

        b.life--;


        let remove =
            b.life<=0 ||
            b.x<0 ||
            b.x>W ||
            b.y<0 ||
            b.y>H;


        if(remove){

            bullets.splice(i,1);
            continue;

        }


        for(let car of cars){

            if(
                car.dead ||
                car.team===b.team ||
                car===b.owner
            )
                continue;


            if(
                Math.hypot(
                    car.x-b.x,
                    car.y-b.y
                )<27
            ){

                car.damage(
                    b.damage,
                    b.owner
                );

                bullets.splice(i,1);

                break;

            }

        }

    }

}


/* =========================================================
   BULLET DRAW
   ========================================================= */

function drawBullets(){

    for(let b of bullets){

        ctx.beginPath();

        ctx.arc(
            b.x,
            b.y,
            5,
            0,
            Math.PI*2
        );

        ctx.fillStyle =
            b.team==="enemy"
            ? "#ff4050"
            : "#ffd23f";

        ctx.shadowBlur=12;

        ctx.shadowColor=
            ctx.fillStyle;

        ctx.fill();

        ctx.shadowBlur=0;

    }

}


/* =========================================================
   PARTICLES
   ========================================================= */

function createExplosion(x,y,count){

    for(let i=0;i<count;i++){

        particles.push({

            x,
            y,

            vx:
                (Math.random()-.5)*5,

            vy:
                (Math.random()-.5)*5,

            life:
                25+
                Math.random()*25,

            size:
                2+
                Math.random()*4

        });

    }

}


function updateParticles(){

    for(
        let i=particles.length-1;
        i>=0;
        i--
    ){

        let p=particles[i];

        p.x+=p.vx;
        p.y+=p.vy;

        p.vx*=.96;
        p.vy*=.96;

        p.life--;


        if(p.life<=0){

            particles.splice(i,1);

        }

    }

}


function drawParticles(){

    for(let p of particles){

        ctx.globalAlpha=
            p.life/50;

        ctx.fillStyle="#ffb52e";

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

    ctx.globalAlpha=1;

}


/* =========================================================
   ARENA
   ========================================================= */

function drawArena(){

    ctx.fillStyle="#101721";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* grid */

    ctx.strokeStyle=
        "rgba(100,130,160,.08)";

    ctx.lineWidth=1;


    let grid=50;


    for(
        let x=0;
        x<W;
        x+=grid
    ){

        ctx.beginPath();

        ctx.moveTo(x,0);
        ctx.lineTo(x,H);

        ctx.stroke();

    }


    for(
        let y=0;
        y<H;
        y+=grid
    ){

        ctx.beginPath();

        ctx.moveTo(0,y);
        ctx.lineTo(W,y);

        ctx.stroke();

    }


    /* border */

    ctx.strokeStyle="#42536c";

    ctx.lineWidth=5;

    ctx.strokeRect(
        20,
        20,
        W-40,
        H-40
    );


    /* center */

    ctx.beginPath();

    ctx.arc(
        W/2,
        H/2,
        90,
        0,
        Math.PI*2
    );

    ctx.strokeStyle=
        "rgba(255,160,40,.18)";

    ctx.stroke();


    /* obstacles */

    const obstacles=[

        [W*.25,H*.3,70,35],
        [W*.7,H*.3,70,35],
        [W*.25,H*.7,70,35],
        [W*.7,H*.7,70,35]

    ];


    for(let o of obstacles){

        ctx.fillStyle="#273244";

        ctx.fillRect(
            o[0],
            o[1],
            o[2],
            o[3]
        );

        ctx.strokeStyle="#44546b";

        ctx.strokeRect(
            o[0],
            o[1],
            o[2],
            o[3]
        );

    }

}


/* =========================================================
   GAME SETUP
   ========================================================= */

function startGame(){

    document.getElementById("menu")
        .style.display="none";

    document.getElementById("game")
        .style.display="block";

    document.getElementById("result")
        .style.display="none";


    cars=[];
    bullets=[];
    particles=[];

    playerKills=0;
    enemyKills=0;


    /* player */

    player =
        new Car(
            W/2,
            H-150,
            "player",
            true
        );

    cars.push(player);


    if(gameMode==="single"){

        /*
          1 player
          3 enemies
        */

        createEnemy(
            150,
            150
        );

        createEnemy(
            W-150,
            150
        );

        createEnemy(
            W/2,
            120
        );

    }else{

        /*
          Team battle
        */

        /*
          1 player =
          1 player + 2 AI helpers
        */

        /*
          2 players =
          2 human + 1 AI helper

          Since this prototype is local,
          player 2 and player 3 can be
          controlled using alternate keys.
        */

        if(humanPlayers>=2){

            cars.push(
                new Car(
                    W/2-100,
                    H-130,
                    "player2",
                    true
                )
            );

        }


        if(humanPlayers>=3){

            cars.push(
                new Car(
                    W/2+100,
                    H-130,
                    "player3",
                    true
                )
            );

        }


        /* Fill team with AI */

        while(
            cars.filter(c=>
                c.team==="player" ||
                c.team==="ally" ||
                c.team==="player2" ||
                c.team==="player3"
            ).length < 3
        ){

            cars.push(
                new Car(
                    100+
                    Math.random()*(W-200),
                    H-100-
                    Math.random()*100,
                    "ally",
                    false
                )
            );

        }


        /* 3 enemy team */

        createEnemy(
            150,
            150
        );

        createEnemy(
            W-150,
            150
        );

        createEnemy(
            W/2,
            100
        );

    }


    gameRunning=true;

    lastTime=
        performance.now();

    requestAnimationFrame(loop);

}


function createEnemy(x,y){

    let c =
        new Car(
            x,
            y,
            "enemy",
            false
        );

    cars.push(c);

}


/* =========================================================
   WIN
   ========================================================= */

function checkWin(){

    let enemies =
        cars.filter(
            c =>
                c.team==="enemy" &&
                !c.dead
        );


    let allies =
        cars.filter(
            c =>
                (
                    c.team==="player" ||
                    c.team==="ally" ||
                    c.team==="player2" ||
                    c.team==="player3"
                ) &&
                !c.dead
        );


    if(enemies.length===0){

        endGame(true);

    }


    if(allies.length===0){

        endGame(false);

    }

}


function endGame(win){

    gameRunning=false;

    document.getElementById("result")
        .style.display="flex";


    document.getElementById("resultTitle")
        .textContent =
            win
            ? "🏆 VICTORY"
            : "💀 DEFEAT";


    document.getElementById("resultText")
        .textContent =
            win
            ? "Enemy team destroyed!"
            : "Your team has been destroyed.";

}


/* =========================================================
   HUD
   ========================================================= */

function updateHUD(){

    if(!player)
        return;


    let hp =
        Math.max(
            0,
            player.hp
        );


    document.getElementById("playerHP")
        .style.width =
            hp+"%";


    document.getElementById("hpText")
        .textContent =
            Math.ceil(hp);


    document.getElementById("score")
        .textContent =
            playerKills+
            " - "+
            enemyKills;

}


/* =========================================================
   GAME LOOP
   ========================================================= */

function loop(time){

    if(!gameRunning)
        return;


    let dt =
        Math.min(
            2,
            (time-lastTime)/16.67
        );

    lastTime=time;


    update(dt);

    draw();


    requestAnimationFrame(loop);

}


function update(dt){

    for(let car of cars){

        car.update(dt);

    }


    updateBullets();

    updateParticles();

    updateHUD();

}


/* =========================================================
   DRAW
   ========================================================= */

function draw(){

    drawArena();

    drawBullets();

    for(let car of cars){

        car.draw();

    }

    drawParticles();

}


/* =========================================================
   TOUCH CONTROLS
   ========================================================= */

function bindControl(id,key){

    const el=
        document.getElementById(id);


    el.addEventListener(
        "pointerdown",
        e=>{
            e.preventDefault();
            keys[key]=true;
        }
    );


    el.addEventListener(
        "pointerup",
        e=>{
            e.preventDefault();
            keys[key]=false;
        }
    );


    el.addEventListener(
        "pointerleave",
        ()=>{
            keys[key]=false;
        }
    );

}


bindControl("up","w");
bindControl("down","s");
bindControl("left","a");
bindControl("right","d");

bindControl("fire","f");
bindControl("boost","shift");


/* =========================================================
   BUTTONS
   ========================================================= */

document.getElementById("startBtn")
    .onclick=startGame;


document.getElementById("restartBtn")
    .onclick=()=>{

        document.getElementById("result")
            .style.display="none";

        startGame();

    };


/* =========================================================
   DEFAULT MENU
   ========================================================= */

document.getElementById("teamOptions")
    .style.display="none";

</script>
