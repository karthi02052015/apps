<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<title>Car Clash Arena</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#070a10;
    font-family:Arial,Helvetica,sans-serif;
    touch-action:none;
}

button{
    font-family:inherit;
    -webkit-tap-highlight-color:transparent;
}

#app{
    width:100vw;
    height:100dvh;
    position:relative;
    overflow:hidden;
}

/* =====================================================
   MENU
===================================================== */

#menu{
    position:absolute;
    inset:0;
    z-index:100;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
        radial-gradient(
            circle at 50% 35%,
            #283752 0%,
            #101725 38%,
            #05070b 100%
        );

    padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
}

.menu-box{
    width:min(520px,92vw);
    max-height:94dvh;
    overflow:auto;

    padding:clamp(20px,5vw,38px);

    border-radius:26px;

    background:
        linear-gradient(
            145deg,
            rgba(24,31,45,.98),
            rgba(8,12,20,.98)
        );

    border:1px solid #3b4962;

    box-shadow:
        0 25px 80px rgba(0,0,0,.7);
}

.logo{
    text-align:center;

    font-size:
        clamp(30px,9vw,48px);

    font-weight:1000;

    letter-spacing:2px;

    color:#ffbd32;

    text-shadow:
        0 4px 20px rgba(255,123,0,.55);
}

.subtitle{
    text-align:center;

    margin-top:5px;
    margin-bottom:25px;

    color:#8491a7;

    font-size:12px;
    letter-spacing:3px;
}

.section-title{
    color:#98a5ba;

    font-size:11px;

    font-weight:bold;

    margin:
        18px 0 9px;

    letter-spacing:1px;
}

.mode-row,
.players-row{
    display:flex;
    gap:8px;
}

.mode-btn,
.player-btn{
    flex:1;

    min-height:52px;

    border-radius:13px;

    border:1px solid #35435b;

    background:#171e2c;

    color:#dce3ef;

    font-size:13px;

    font-weight:800;
}

.mode-btn.active,
.player-btn.active{
    background:
        linear-gradient(
            135deg,
            #ffc13d,
            #ff7300
        );

    color:#111;

    border-color:#ffd879;
}

#startBtn{
    width:100%;

    min-height:60px;

    margin-top:24px;

    border:0;

    border-radius:16px;

    background:
        linear-gradient(
            135deg,
            #ffc43d,
            #ff6500
        );

    color:#111;

    font-size:17px;

    font-weight:1000;

    box-shadow:
        0 10px 30px rgba(255,100,0,.3);
}

/* =====================================================
   GAME
===================================================== */

#game{
    position:absolute;
    inset:0;
    display:none;
    overflow:hidden;
}

#canvas{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    display:block;
}

/* =====================================================
   HUD
===================================================== */

#hud{
    position:absolute;

    z-index:10;

    top:
        calc(env(safe-area-inset-top) + 8px);

    left:
        calc(env(safe-area-inset-left) + 8px);

    right:
        calc(env(safe-area-inset-right) + 8px);

    display:flex;

    justify-content:space-between;

    pointer-events:none;
}

.hud-box{
    min-width:130px;

    padding:8px 10px;

    border-radius:12px;

    background:rgba(6,9,15,.78);

    border:1px solid rgba(100,120,150,.4);

    backdrop-filter:blur(8px);
}

.hud-title{
    font-size:9px;

    color:#8e9aae;

    margin-bottom:5px;

    letter-spacing:1px;
}

.hp-bar{
    width:120px;
    height:8px;

    overflow:hidden;

    border-radius:10px;

    background:#252c38;
}

.hp-fill{
    width:100%;
    height:100%;

    background:#43e477;
}

.hp-text{
    margin-top:4px;

    font-size:10px;

    color:#dce4ed;
}

#objective{
    text-align:right;
}

#score{
    font-size:18px;
    font-weight:900;
}

/* =====================================================
   MOBILE CONTROLS
===================================================== */

#controls{
    position:absolute;
    inset:0;

    z-index:20;

    pointer-events:none;
}

/* joystick */

#joystick{
    position:absolute;

    left:
        calc(
            env(safe-area-inset-left) +
            clamp(18px,5vw,45px)
        );

    bottom:
        calc(
            env(safe-area-inset-bottom) +
            clamp(18px,5vw,35px)
        );

    width:
        clamp(125px,31vw,170px);

    height:
        clamp(125px,31vw,170px);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(90,105,130,.28),
            rgba(20,27,40,.5)
        );

    border:
        2px solid
        rgba(150,165,190,.3);

    pointer-events:auto;
}

#joystickKnob{
    position:absolute;

    left:50%;
    top:50%;

    width:
        clamp(55px,14vw,72px);

    height:
        clamp(55px,14vw,72px);

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:
        linear-gradient(
            145deg,
            #56647a,
            #283345
        );

    border:2px solid #718097;

    box-shadow:
        0 6px 18px rgba(0,0,0,.4);
}

/* action buttons */

.action-btn{
    position:absolute;

    pointer-events:auto;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    color:white;

    font-weight:1000;

    border:2px solid rgba(255,255,255,.3);

    box-shadow:
        0 7px 20px rgba(0,0,0,.4);

    transition:
        transform .08s,
        filter .08s;
}

.action-btn:active{
    transform:scale(.9);
    filter:brightness(1.3);
}

#fire{
    right:
        calc(
            env(safe-area-inset-right) +
            clamp(20px,6vw,45px)
        );

    bottom:
        calc(
            env(safe-area-inset-bottom) +
            clamp(25px,7vw,50px)
        );

    width:
        clamp(78px,19vw,105px);

    height:
        clamp(78px,19vw,105px);

    background:
        radial-gradient(
            circle at 35% 30%,
            #ff7750,
            #d82917
        );

    font-size:13px;
}

#boost{
    right:
        calc(
            env(safe-area-inset-right) +
            clamp(115px,28vw,160px)
        );

    bottom:
        calc(
            env(safe-area-inset-bottom) +
            clamp(20px,6vw,40px)
        );

    width:
        clamp(58px,14vw,75px);

    height:
        clamp(58px,14vw,75px);

    background:
        radial-gradient(
            circle,
            #4c9cff,
            #1450c5
        );

    font-size:10px;
}

/* =====================================================
   RESULT
===================================================== */

#result{
    position:absolute;
    inset:0;

    z-index:200;

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:
        rgba(0,0,0,.75);

    backdrop-filter:blur(6px);
}

.result-box{
    width:min(400px,90vw);

    padding:30px 22px;

    border-radius:24px;

    text-align:center;

    background:#111824;

    border:1px solid #40506a;
}

#resultTitle{
    font-size:
        clamp(32px,10vw,48px);

    margin-bottom:10px;
}

#resultText{
    color:#aab5c7;

    margin-bottom:22px;
}

#restartBtn{
    width:100%;

    min-height:56px;

    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            #ffc13b,
            #ff6b00
        );

    font-weight:1000;
}

/* =====================================================
   LANDSCAPE WARNING
===================================================== */

#rotateWarning{
    position:absolute;
    inset:0;

    z-index:500;

    display:none;

    align-items:center;
    justify-content:center;

    text-align:center;

    padding:30px;

    background:#070a10;

    color:white;
}

.rotate-icon{
    font-size:55px;
    margin-bottom:15px;
}

.rotate-text{
    font-size:18px;
    font-weight:bold;
}

/* phones in portrait */

@media
(max-width:700px)
and
(orientation:portrait){

    #rotateWarning{
        display:flex;
    }

}

/* very small landscape phones */

@media
(max-height:430px)
and
(orientation:landscape){

    .hud-box{
        padding:5px 8px;
    }

    #joystick{
        width:115px;
        height:115px;
    }

    #joystickKnob{
        width:52px;
        height:52px;
    }
}

/* desktop */

@media(min-width:1000px){

    #controls{
        opacity:.75;
    }

}
</style>
</head>

<body>

<div id="app">

<!-- =====================================================
     ROTATE
===================================================== -->

<div id="rotateWarning">

    <div>

        <div class="rotate-icon">
            📱↔️
        </div>

        <div class="rotate-text">
            Rotate your phone<br>
            to landscape mode
        </div>

    </div>

</div>


<!-- =====================================================
     MENU
===================================================== -->

<div id="menu">

    <div class="menu-box">

        <div class="logo">
            CAR CLASH
        </div>

        <div class="subtitle">
            ARENA COMBAT
        </div>


        <div class="section-title">
            GAME MODE
        </div>

        <div class="mode-row">

            <button
                class="mode-btn active"
                data-mode="single">

                SINGLE PLAYER

            </button>

            <button
                class="mode-btn"
                data-mode="team">

                TEAM BATTLE

            </button>

        </div>


        <div id="teamOptions"
             style="display:none">

            <div class="section-title">
                HUMAN PLAYERS
            </div>

            <div class="players-row">

                <button
                    class="player-btn active"
                    data-players="1">

                    1 PLAYER

                </button>

                <button
                    class="player-btn"
                    data-players="2">

                    2 PLAYERS

                </button>

                <button
                    class="player-btn"
                    data-players="3">

                    3 PLAYERS

                </button>

            </div>

        </div>


        <button id="startBtn">
            🚗 START BATTLE
        </button>

    </div>

</div>


<!-- =====================================================
     GAME
===================================================== -->

<div id="game">

    <canvas id="canvas"></canvas>


    <!-- HUD -->

    <div id="hud">

        <div class="hud-box">

            <div class="hud-title">
                YOUR CAR
            </div>

            <div class="hp-bar">

                <div
                    id="playerHP"
                    class="hp-fill">
                </div>

            </div>

            <div class="hp-text">

                <span id="hpText">
                    100
                </span>

                HP

            </div>

        </div>


        <div
            class="hud-box"
            id="objective">

            <div class="hud-title">
                BATTLE
            </div>

            <div id="score">
                0 - 0
            </div>

        </div>

    </div>


    <!-- CONTROLS -->

    <div id="controls">

        <div id="joystick">

            <div id="joystickKnob"></div>

        </div>


        <div
            id="boost"
            class="action-btn">

            ⚡

        </div>


        <div
            id="fire"
            class="action-btn">

            🔥 FIRE

        </div>

    </div>

</div>


<!-- =====================================================
     RESULT
===================================================== -->

<div id="result">

    <div class="result-box">

        <div id="resultTitle">
            🏆 VICTORY
        </div>

        <div id="resultText">
            Enemy team destroyed!
        </div>

        <button id="restartBtn">
            PLAY AGAIN
        </button>

    </div>

</div>

</div>


<script>

/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

let W=0;
let H=0;

function resize(){

    W =
        canvas.width =
        window.innerWidth *
        devicePixelRatio;

    H =
        canvas.height =
        window.innerHeight *
        devicePixelRatio;

    canvas.style.width =
        window.innerWidth+"px";

    canvas.style.height =
        window.innerHeight+"px";

    ctx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
    );

    W=window.innerWidth;
    H=window.innerHeight;

}

window.addEventListener(
    "resize",
    resize
);

resize();


/* =====================================================
   GAME VARIABLES
===================================================== */

let gameRunning=false;

let gameMode="single";

let humanPlayers=1;

let cars=[];
let bullets=[];
let particles=[];

let player=null;

let playerKills=0;
let enemyKills=0;

let lastTime=0;


/* =====================================================
   MOBILE INPUT
===================================================== */

let joystick={
    active:false,
    x:0,
    y:0
};

let firePressed=false;
let boostPressed=false;


/* =====================================================
   MENU
===================================================== */

document
.querySelectorAll(".mode-btn")
.forEach(btn=>{

    btn.addEventListener(
        "click",
        ()=>{

            document
            .querySelectorAll(".mode-btn")
            .forEach(b=>
                b.classList.remove("active")
            );

            btn.classList.add("active");

            gameMode =
                btn.dataset.mode;

            document
            .getElementById("teamOptions")
            .style.display =
                gameMode==="team"
                ? "block"
                : "none";

        }
    );

});


document
.querySelectorAll(".player-btn")
.forEach(btn=>{

    btn.addEventListener(
        "click",
        ()=>{

            document
            .querySelectorAll(".player-btn")
            .forEach(b=>
                b.classList.remove("active")
            );

            btn.classList.add("active");

            humanPlayers =
                Number(btn.dataset.players);

        }
    );

});


/* =====================================================
   KEYBOARD
===================================================== */

let keys={};

window.addEventListener(
    "keydown",
    e=>{

        keys[e.key.toLowerCase()]=true;

    }
);

window.addEventListener(
    "keyup",
    e=>{

        keys[e.key.toLowerCase()]=false;

    }
);


/* =====================================================
   CAR CLASS
===================================================== */

class Car{

    constructor(
        x,
        y,
        team,
        human=false
    ){

        this.x=x;
        this.y=y;

        this.team=team;

        this.human=human;

        this.angle=0;

        this.speed=0;

        this.maxSpeed=3.8;

        this.hp=100;

        this.maxHp=100;

        this.cooldown=0;

        this.dead=false;

        this.boost=100;

        this.width=38;
        this.height=56;

    }


    update(){

        if(this.dead)
            return;


        if(this.human){

            this.playerControl();

        }else{

            this.aiControl();

        }


        this.speed*=.94;


        this.x +=
            Math.sin(this.angle) *
            this.speed;

        this.y -=
            Math.cos(this.angle) *
            this.speed;


        this.x =
            Math.max(
                32,
                Math.min(
                    W-32,
                    this.x
                )
            );


        this.y =
            Math.max(
                32,
                Math.min(
                    H-32,
                    this.y
                )
            );


        if(this.cooldown>0)
            this.cooldown--;

    }


    playerControl(){

        /*
         MOBILE JOYSTICK
        */

        if(
            joystick.active
        ){

            let sx=
                joystick.x;

            let sy=
                joystick.y;


            let magnitude=
                Math.hypot(
                    sx,
                    sy
                );


            if(magnitude>.1){

                let desired=
                    Math.atan2(
                        sx,
                        -sy
                    );


                let diff=
                    normalizeAngle(
                        desired-this.angle
                    );


                this.angle +=
                    Math.max(
                        -.07,
                        Math.min(
                            .07,
                            diff
                        )
                    );


                this.speed +=
                    .18 *
                    Math.min(
                        1,
                        magnitude
                    );

            }

        }


        /*
         DESKTOP KEYBOARD
        */

        if(
            keys["w"] ||
            keys["arrowup"]
        ){

            this.speed+=.16;

        }


        if(
            keys["s"] ||
            keys["arrowdown"]
        ){

            this.speed-=.12;

        }


        if(
            keys["a"] ||
            keys["arrowleft"]
        ){

            this.angle-=.055;

        }


        if(
            keys["d"] ||
            keys["arrowright"]
        ){

            this.angle+=.055;

        }


        this.speed=
            Math.max(
                -.9,
                Math.min(
                    this.maxSpeed,
                    this.speed
                )
            );


        if(
            firePressed ||
            keys[" "] ||
            keys["f"]
        ){

            this.shoot();

        }


        if(
            boostPressed ||
            keys["shift"]
        ){

            this.useBoost();

        }

    }


    aiControl(){

        let enemies=
            cars.filter(
                c=>
                    !c.dead &&
                    !sameTeam(
                        this,
                        c
                    )
            );


        if(!enemies.length)
            return;


        enemies.sort(
            (a,b)=>
                distance(this,a)-
                distance(this,b)
        );


        let target=
            enemies[0];


        let dx=
            target.x-this.x;

        let dy=
            target.y-this.y;


        let desired=
            Math.atan2(
                dx,
                -dy
            );


        let diff=
            normalizeAngle(
                desired-this.angle
            );


        this.angle +=
            Math.max(
                -.045,
                Math.min(
                    .045,
                    diff
                )
            );


        let d=
            Math.hypot(dx,dy);


        if(d>190)
            this.speed+=.10;

        if(d<120)
            this.speed-=.08;


        this.speed=
            Math.max(
                -.6,
                Math.min(
                    2.8,
                    this.speed
                )
            );


        if(
            Math.abs(diff)<.18 &&
            d<500
        ){

            this.shoot();

        }

    }


    shoot(){

        if(this.cooldown>0)
            return;


        this.cooldown=
            this.human
            ? 15
            : 35;


        bullets.push({

            x:
                this.x+
                Math.sin(this.angle)*36,

            y:
                this.y-
                Math.cos(this.angle)*36,

            vx:
                Math.sin(this.angle)*9,

            vy:
                -Math.cos(this.angle)*9,

            team:this.team,

            owner:this,

            damage:
                this.human
                ? 17
                : 10,

            life:80

        });

    }


    useBoost(){

        if(this.boost<=0)
            return;


        this.speed+=.4;

        this.boost-=1;

    }


    damage(amount,attacker){

        if(this.dead)
            return;


        this.hp-=amount;


        explosion(
            this.x,
            this.y,
            5
        );


        if(this.hp<=0){

            this.hp=0;

            this.dead=true;


            explosion(
                this.x,
                this.y,
                30
            );


            if(
                attacker &&
                isFriendly(attacker)
            ){

                playerKills++;

            }


            if(
                attacker &&
                !isFriendly(attacker)
            ){

                enemyKills++;

            }


            checkWin();

        }

    }


    draw(){

        if(this.dead)
            return;


        ctx.save();

        ctx.translate(
            this.x,
            this.y
        );

        ctx.rotate(
            this.angle
        );


        /*
        shadow
        */

        ctx.fillStyle=
            "rgba(0,0,0,.35)";

        ctx.fillRect(
            -17,
            -25,
            38,
            58
        );


        /*
        body
        */

        let color="#e7343e";


        if(
            this.team==="player" ||
            this.team==="ally"
        ){

            color=
                this.team==="player"
                ? "#ff9d00"
                : "#279cff";

        }


        ctx.fillStyle=color;


        ctx.beginPath();

        ctx.roundRect(
            -19,
            -28,
            38,
            56,
            8
        );

        ctx.fill();


        /*
        roof
        */

        ctx.fillStyle="#1c2531";

        ctx.beginPath();

        ctx.roundRect(
            -13,
            -15,
            26,
            27,
            6
        );

        ctx.fill();


        /*
        glass
        */

        ctx.fillStyle="#69d9ff";

        ctx.fillRect(
            -9,
            -10,
            18,
            8
        );


        /*
        lights
        */

        ctx.fillStyle="#fff0a0";

        ctx.fillRect(
            -13,
            -27,
            8,
            5
        );

        ctx.fillRect(
            5,
            -27,
            8,
            5
        );


        /*
        wheels
        */

        ctx.fillStyle="#080a0e";

        ctx.fillRect(
            -22,
            -20,
            7,
            16
        );

        ctx.fillRect(
            15,
            -20,
            7,
            16
        );

        ctx.fillRect(
            -22,
            6,
            7,
            16
        );

        ctx.fillRect(
            15,
            6,
            7,
            16
        );


        ctx.restore();


        /*
        health bar
        */

        ctx.fillStyle="#171b22";

        ctx.fillRect(
            this.x-25,
            this.y-40,
            50,
            5
        );


        ctx.fillStyle=
            isFriendly(this)
            ? "#45e875"
            : "#ff404a";


        ctx.fillRect(
            this.x-25,
            this.y-40,
            50*(this.hp/100),
            5
        );

    }

}


/* =====================================================
   TEAM
===================================================== */

function isFriendly(car){

    return(
        car.team==="player" ||
        car.team==="ally" ||
        car.team==="player2" ||
        car.team==="player3"
    );

}


function sameTeam(a,b){

    return(
        isFriendly(a) &&
        isFriendly(b)
    ) ||
    (
        a.team==="enemy" &&
        b.team==="enemy"
    );

}


/* =====================================================
   DISTANCE
===================================================== */

function distance(a,b){

    return Math.hypot(
        a.x-b.x,
        a.y-b.y
    );

}


function normalizeAngle(a){

    while(a>Math.PI)
        a-=Math.PI*2;

    while(a<-Math.PI)
        a+=Math.PI*2;

    return a;

}


/* =====================================================
   START GAME
===================================================== */

function startGame(){

    document
    .getElementById("menu")
    .style.display="none";


    document
    .getElementById("game")
    .style.display="block";


    document
    .getElementById("result")
    .style.display="none";


    cars=[];
    bullets=[];
    particles=[];


    playerKills=0;
    enemyKills=0;


    player=
        new Car(
            W/2,
            H-130,
            "player",
            true
        );


    cars.push(player);


    if(gameMode==="single"){

        enemy(
            100,
            100
        );

        enemy(
            W-100,
            100
        );

        enemy(
            W/2,
            100
        );

    }else{

        /*
        Add human players
        */

        if(humanPlayers>=2){

            cars.push(
                new Car(
                    W/2-80,
                    H-120,
                    "player2",
                    true
                )
            );

        }


        if(humanPlayers>=3){

            cars.push(
                new Car(
                    W/2+80,
                    H-120,
                    "player3",
                    true
                )
            );

        }


        /*
        Fill team with AI helpers
        */

        while(
            cars.filter(
                c=>isFriendly(c)
            ).length<3
        ){

            cars.push(
                new Car(
                    W/2+
                    (Math.random()-.5)*200,

                    H-100,

                    "ally",

                    false
                )
            );

        }


        /*
        enemies
        */

        enemy(100,100);
        enemy(W-100,100);
        enemy(W/2,90);

    }


    gameRunning=true;

    lastTime=
        performance.now();


    requestAnimationFrame(loop);

}


function enemy(x,y){

    cars.push(
        new Car(
            x,
            y,
            "enemy",
            false
        )
    );

}


/* =====================================================
   GAME LOOP
===================================================== */

function loop(){

    if(!gameRunning)
        return;


    update();

    draw();


    requestAnimationFrame(loop);

}


function update(){

    for(
        const car of cars
    ){

        car.update();

    }


    updateBullets();

    updateParticles();

    updateHUD();

}


/* =====================================================
   BULLETS
===================================================== */

function updateBullets(){

    for(
        let i=bullets.length-1;
        i>=0;
        i--
    ){

        const b=
            bullets[i];


        b.x+=b.vx;
        b.y+=b.vy;

        b.life--;


        if(
            b.life<=0 ||
            b.x<0 ||
            b.x>W ||
            b.y<0 ||
            b.y>H
        ){

            bullets.splice(i,1);
            continue;

        }


        for(
            const car of cars
        ){

            if(
                car.dead ||
                sameTeam(
                    car,
                    b.owner
                )
            )
                continue;


            if(
                Math.hypot(
                    car.x-b.x,
                    car.y-b.y
                )<27
            ){

                car.damage(
                    b.damage,
                    b.owner
                );


                bullets.splice(i,1);

                break;

            }

        }

    }

}


function drawBullets(){

    for(
        const b of bullets
    ){

        ctx.beginPath();

        ctx.arc(
            b.x,
            b.y,
            4,
            0,
            Math.PI*2
        );

        ctx.fillStyle=
            isFriendly(
                b.owner
            )
            ? "#ffd34a"
            : "#ff4040";

        ctx.fill();

    }

}


/* =====================================================
   PARTICLES
===================================================== */

function explosion(
    x,
    y,
    amount
){

    for(
        let i=0;
        i<amount;
        i++
    ){

        particles.push({

            x,
            y,

            vx:
                (Math.random()-.5)*5,

            vy:
                (Math.random()-.5)*5,

            life:
                20+
                Math.random()*25,

            size:
                2+
                Math.random()*4

        });

    }

}


function updateParticles(){

    for(
        let i=particles.length-1;
        i>=0;
        i--
    ){

        let p=
            particles[i];


        p.x+=p.vx;
        p.y+=p.vy;

        p.vx*=.95;
        p.vy*=.95;

        p.life--;


        if(p.life<=0)
            particles.splice(i,1);

    }

}


function drawParticles(){

    for(
        const p of particles
    ){

        ctx.globalAlpha=
            p.life/45;

        ctx.fillStyle="#ffb52d";

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

    ctx.globalAlpha=1;

}


/* =====================================================
   ARENA
===================================================== */

function drawArena(){

    ctx.fillStyle="#101720";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /*
    grid
    */

    ctx.strokeStyle=
        "rgba(100,130,160,.08)";

    ctx.lineWidth=1;


    const grid=50;


    for(
        let x=0;
        x<W;
        x+=grid
    ){

        ctx.beginPath();

        ctx.moveTo(x,0);
        ctx.lineTo(x,H);

        ctx.stroke();

    }


    for(
        let y=0;
        y<H;
        y+=grid
    ){

        ctx.beginPath();

        ctx.moveTo(0,y);
        ctx.lineTo(W,y);

        ctx.stroke();

    }


    /*
    arena border
    */

    ctx.strokeStyle="#40516a";

    ctx.lineWidth=5;

    ctx.strokeRect(
        20,
        20,
        W-40,
        H-40
    );


    /*
    center circle
    */

    ctx.beginPath();

    ctx.arc(
        W/2,
        H/2,
        75,
        0,
        Math.PI*2
    );

    ctx.strokeStyle=
        "rgba(255,160,40,.16)";

    ctx.stroke();


    /*
    obstacles
    */

    const obstacles=[

        [
            W*.25,
            H*.30,
            65,
            30
        ],

        [
            W*.75-65,
            H*.30,
            65,
            30
        ],

        [
            W*.25,
            H*.70,
            65,
            30
        ],

        [
            W*.75-65,
            H*.70,
            65,
            30
        ]

    ];


    for(
        const o of obstacles
    ){

        ctx.fillStyle="#293544";

        ctx.fillRect(
            o[0],
            o[1],
            o[2],
            o[3]
        );


        ctx.strokeStyle="#46576e";

        ctx.strokeRect(
            o[0],
            o[1],
            o[2],
            o[3]
        );

    }

}


/* =====================================================
   DRAW
===================================================== */

function draw(){

    drawArena();

    drawBullets();


    for(
        const car of cars
    ){

        car.draw();

    }


    drawParticles();

}


/* =====================================================
   HUD
===================================================== */

function updateHUD(){

    if(!player)
        return;


    document
    .getElementById("playerHP")
    .style.width =
        player.hp+"%";


    document
    .getElementById("hpText")
    .textContent =
        Math.ceil(player.hp);


    document
    .getElementById("score")
    .textContent =
        playerKills+
        " - "+
        enemyKills;

}


/* =====================================================
   WIN / LOSE
===================================================== */

function checkWin(){

    const enemies=
        cars.filter(
            c=>
                c.team==="enemy" &&
                !c.dead
        );


    const friends=
        cars.filter(
            c=>
                isFriendly(c) &&
                !c.dead
        );


    if(
        enemies.length===0
    ){

        endGame(true);

    }


    if(
        friends.length===0
    ){

        endGame(false);

    }

}


function endGame(win){

    gameRunning=false;


    document
    .getElementById("result")
    .style.display="flex";


    document
    .getElementById("resultTitle")
    .textContent=
        win
        ? "🏆 VICTORY"
        : "💀 DEFEAT";


    document
    .getElementById("resultText")
    .textContent=
        win
        ? "Enemy team destroyed!"
        : "Your team was destroyed.";

}


/* =====================================================
   JOYSTICK
===================================================== */

const joystickElement=
    document.getElementById(
        "joystick"
    );

const knob=
    document.getElementById(
        "joystickKnob"
    );


function joystickMove(e){

    const rect=
        joystickElement
        .getBoundingClientRect();


    const cx=
        rect.left+
        rect.width/2;

    const cy=
        rect.top+
        rect.height/2;


    let dx=
        e.clientX-cx;

    let dy=
        e.clientY-cy;


    const max=
        rect.width*.32;


    const len=
        Math.hypot(
            dx,
            dy
        );


    if(len>max){

        dx=
            dx/len*max;

        dy=
            dy/len*max;

    }


    joystick.x=
        dx/max;

    joystick.y=
        dy/max;


    knob.style.transform=
        `translate(
            calc(-50% + ${dx}px),
            calc(-50% + ${dy}px)
        )`;

}


function joystickReset(){

    joystick.active=false;

    joystick.x=0;
    joystick.y=0;


    knob.style.transform=
        "translate(-50%,-50%)";

}


joystickElement.addEventListener(
    "pointerdown",
    e=>{

        joystick.active=true;

        joystickElement.setPointerCapture(
            e.pointerId
        );

        joystickMove(e);

    }
);


joystickElement.addEventListener(
    "pointermove",
    e=>{

        if(
            joystick.active
        ){

            joystickMove(e);

        }

    }
);


joystickElement.addEventListener(
    "pointerup",
    joystickReset
);


joystickElement.addEventListener(
    "pointercancel",
    joystickReset
);


/* =====================================================
   FIRE BUTTON
===================================================== */

const fire=
    document.getElementById("fire");


fire.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        firePressed=true;

    }
);


fire.addEventListener(
    "pointerup",
    e=>{

        e.preventDefault();

        firePressed=false;

    }
);


fire.addEventListener(
    "pointercancel",
    ()=>{
        firePressed=false;
    }
);


/* =====================================================
   BOOST
===================================================== */

const boost=
    document.getElementById("boost");


boost.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        boostPressed=true;

    }
);


boost.addEventListener(
    "pointerup",
    e=>{

        e.preventDefault();

        boostPressed=false;

    }
);


boost.addEventListener(
    "pointercancel",
    ()=>{
        boostPressed=false;
    }
);


/* =====================================================
   START / RESTART
===================================================== */

document
.getElementById("startBtn")
.addEventListener(
    "click",
    startGame
);


document
.getElementById("restartBtn")
.addEventListener(
    "click",
    startGame
);

</script>
