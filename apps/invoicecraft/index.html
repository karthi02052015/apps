<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InvoiceCraft - Minimalist PDF Invoice Generator</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- html2pdf.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex flex-col overflow-hidden">
    <!-- Header -->
    <header class="bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between shadow-sm">
        <div class="flex items-center space-x-3">
            <div class="bg-blue-600 text-white p-2 rounded-xl shadow-sm">
                <i data-lucide="file-text" class="w-5 h-5"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-tight">InvoiceCraft</h1>
                <p class="text-xs text-slate-500">Minimalist PDF Invoice Creator</p>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <button onclick="downloadPdf()" class="flex items-center space-x-1.5 px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-xl shadow-sm transition">
                <i data-lucide="download" class="w-4 h-4"></i>
                <span>Download PDF</span>
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex-1 flex overflow-hidden">
        <!-- Editor Controls Sidebar -->
        <aside class="w-96 bg-white border-r border-slate-200 flex flex-col p-6 space-y-6 overflow-y-auto">
            <h3 class="font-bold text-slate-800">Invoice Details</h3>
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Invoice Number</label>
                <input type="text" id="inv-num" value="INV-2026-001" oninput="render()" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Client Name</label>
                <input type="text" id="inv-client" value="Acme Corporation" oninput="render()" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Tax Rate (%)</label>
                <input type="number" id="inv-tax" value="10" oninput="render()" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <div class="flex items-center justify-between mb-2">
                    <label class="text-xs font-semibold uppercase tracking-wider text-slate-400">Line Items</label>
                    <button onclick="addItem()" class="text-xs text-blue-600 font-medium hover:underline flex items-center space-x-1"><i data-lucide="plus" class="w-3 h-3"></i><span>Add Item</span></button>
                </div>
                <div id="editor-items" class="space-y-3"></div>
            </div>
        </aside>

        <!-- Preview PDF Sheet -->
        <main class="flex-1 bg-slate-100 flex items-center justify-center p-8 overflow-y-auto">
            <div id="invoice-preview" class="bg-white w-[700px] min-h-[900px] p-12 shadow-2xl rounded-xl flex flex-col justify-between font-sans text-slate-800">
                <div>
                    <div class="flex justify-between items-start border-b border-slate-100 pb-8 mb-8">
                        <div>
                            <h2 class="text-2xl font-extrabold tracking-tight text-slate-900">INVOICE</h2>
                            <p id="prev-num" class="text-xs font-mono text-slate-400 mt-1">INV-2026-001</p>
                        </div>
                        <div class="text-right">
                            <h4 class="font-bold text-sm text-slate-800">Your Company Name</h4>
                            <p class="text-xs text-slate-400">hello@company.com</p>
                        </div>
                    </div>
                    <div class="mb-8">
                        <p class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Billed To:</p>
                        <h3 id="prev-client" class="font-bold text-lg text-slate-800">Acme Corporation</h3>
                    </div>
                    <table class="w-full text-left mb-8">
                        <thead>
                            <tr class="border-b border-slate-200 text-xs uppercase tracking-wider text-slate-400">
                                <th class="pb-3 font-semibold">Description</th>
                                <th class="pb-3 font-semibold text-right">Hours/Qty</th>
                                <th class="pb-3 font-semibold text-right">Rate</th>
                                <th class="pb-3 font-semibold text-right">Amount</th>
                            </tr>
                        </thead>
                        <tbody id="prev-items" class="divide-y divide-slate-100 text-sm"></tbody>
                    </table>
                </div>
                <div class="border-t border-slate-200 pt-6 flex justify-end">
                    <div class="w-64 space-y-2 text-sm">
                        <div class="flex justify-between text-slate-500">
                            <span>Subtotal</span>
                            <span id="prev-subtotal">$0.00</span>
                        </div>
                        <div class="flex justify-between text-slate-500">
                            <span>Tax (<span id="prev-tax-rate">10</span>%)</span>
                            <span id="prev-tax-amount">$0.00</span>
                        </div>
                        <div class="flex justify-between font-bold text-base text-slate-900 border-t border-slate-200 pt-2">
                            <span>Total Due</span>
                            <span id="prev-total">$0.00</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Script Application Logic -->
    <script>
        let state = {
            number: 'INV-2026-001',
            client: 'Acme Corporation',
            taxRate: 10,
            items: [
                { id: 'i1', desc: 'Full Stack Development', qty: 40, rate: 75 },
                { id: 'i2', desc: 'UI/UX Design Consultation', qty: 10, rate: 100 }
            ]
        };

        function render() {
            lucide.createIcons();
            state.number = document.getElementById('inv-num').value;
            state.client = document.getElementById('inv-client').value;
            state.taxRate = Number(document.getElementById('inv-tax').value) || 0;

            document.getElementById('prev-num').innerText = state.number;
            document.getElementById('prev-client').innerText = state.client;
            document.getElementById('prev-tax-rate').innerText = state.taxRate;

            // Render Editor Inputs
            const editorContainer = document.getElementById('editor-items');
            editorContainer.innerHTML = '';
            state.items.forEach((item, idx) => {
                const div = document.createElement('div');
                div.className = 'bg-slate-50 p-3 rounded-xl border border-slate-200 space-y-2 relative group';
                div.innerHTML = `
                    <input type="text" value="${item.desc}" oninput="updateItem(${idx}, 'desc', this.value)" class="w-full px-2.5 py-1.5 bg-white border border-slate-200 rounded-lg text-xs" placeholder="Description">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" value="${item.qty}" oninput="updateItem(${idx}, 'qty', this.value)" class="w-full px-2.5 py-1.5 bg-white border border-slate-200 rounded-lg text-xs" placeholder="Qty">
                        <input type="number" value="${item.rate}" oninput="updateItem(${idx}, 'rate', this.value)" class="w-full px-2.5 py-1.5 bg-white border border-slate-200 rounded-lg text-xs" placeholder="Rate">
                    </div>
                    <button onclick="removeItem(${idx})" class="absolute top-2 right-2 text-slate-400 hover:text-red-500"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
                `;
                editorContainer.appendChild(div);
            });

            // Render Preview Table & Totals
            const prevItems = document.getElementById('prev-items');
            prevItems.innerHTML = '';
            let subtotal = 0;
            state.items.forEach(item => {
                const amt = item.qty * item.rate;
                subtotal += amt;
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="py-3 font-medium text-slate-800">${item.desc}</td>
                    <td class="py-3 text-right text-slate-600">${item.qty}</td>
                    <td class="py-3 text-right text-slate-600">$${item.rate.toFixed(2)}</td>
                    <td class="py-3 text-right font-semibold text-slate-800">$${amt.toFixed(2)}</td>
                `;
                prevItems.appendChild(tr);
            });

            const taxAmount = subtotal * (state.taxRate / 100);
            const total = subtotal + taxAmount;

            document.getElementById('prev-subtotal').innerText = `$${subtotal.toFixed(2)}`;
            document.getElementById('prev-tax-amount').innerText = `$${taxAmount.toFixed(2)}`;
            document.getElementById('prev-total').innerText = `$${total.toFixed(2)}`;
            lucide.createIcons();
        }

        function addItem() {
            state.items.push({ id: 'i_' + Math.random(), desc: 'New Service Item', qty: 1, rate: 50 });
            render();
        }

        function updateItem(idx, field, val) {
            state.items[idx][field] = field === 'desc' ? val : Number(val);
            render();
        }

        function removeItem(idx) {
            state.items.splice(idx, 1);
            render();
        }

        function downloadPdf() {
            const element = document.getElementById('invoice-preview');
            const opt = {
                margin: 10,
                filename: `${state.number}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().from(element).set(opt).save();
        }

        window.onload = render;
    </script>
</body>
</html>
